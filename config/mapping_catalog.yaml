# Starter Xactimate-candidate catalog. Honest and intentionally incomplete
# -- see docs/mapping-engine.md "Xactimate data integrity".
#
# `xactimate.category` is populated ONLY where this repository has direct
# verified evidence: the roofing ("RFG") entries are backed by literal
# "Component RFG300 ..." / "Component RFG240 ..." text printed in several of
# the fixture PDFs' own ITEL pricing notes (Aranda, Garrety, Bagi use
# RFG300 for laminated shingles; Odom, Garcia, Wei Tang use RFG240 for
# 3-tab). Every other trade has NO verified source in this repository for
# its Xactimate category/selector, so `category` and `selector` are both
# left null there, `requires_review: true`, and a note explains what must
# be verified before automation. This is deliberate: it would be dishonest
# to fabricate category letters from general industry familiarity alone
# without a documented authoritative source (a licensed Xactimate price
# list) in this repository -- see the build spec's "Xactimate data
# integrity" requirement.

- mapping_id: "rfg_laminated_shingle_remove"
  canonical_terms: ["laminated composition shingles", "laminated comp. shingle"]
  trade: "roofing"
  component: "composition_shingles"
  allowed_actions: ["remove"]
  allowed_units: ["SQ"]
  xactimate:
    category: "RFG"
    selector: null
    activity: "remove"
    description: "Tear off laminated composition shingle roofing"
  confidence_base: 0.85
  requires_review: true
  notes:
    - "Category 'RFG' verified from source-document ITEL pricing notes referencing component RFG300."
    - "Exact selector must be verified against a licensed Xactimate price list."

