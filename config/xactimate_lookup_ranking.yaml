# Phase 3.8 dropdown-result ranking. Same deterministic weighted-score +
# hard-conflict-cap shape as config/selector_recommendation_scoring.yaml
# and mapping/scorer.py -- no LLM, no opaque logic. Every weight/threshold
# here is reviewable and editable without a code change.

weights:
  description_similarity: 0.25
  component_match: 0.25
  material_match: 0.15
  size_match: 0.10
  action_compatibility: 0.10
  unit_compatibility: 0.05
  grade_style_match: 0.05
  prior_verified_mapping: 0.05

# A hard conflict on any of these caps the final score, regardless of
# text-similarity strength -- mirrors mapping/scorer.py's conflict-
# override rule.
conflict_caps:
  wrong_component: 0.45
  wrong_material: 0.55
  wrong_size: 0.60
  wrong_action: 0.50
  wrong_unit: 0.55
  incompatible_grade_or_style: 0.55

thresholds:
  auto_select_min: 0.88
  review_required_min: 0.55
  # below review_required_min -> NO_MATCH

# AUTO_SELECT additionally requires ALL of:
#   - top score >= auto_select_min
#   - no hard conflict on the top candidate
#   - top candidate's extraction_confidence >= min_extraction_confidence
#   - (top_score - second_score) >= auto_select_margin
auto_select_margin: 0.08
min_extraction_confidence: 0.80

fuzzy_matching:
  enabled: true
  library: "rapidfuzz"
  min_score: 0.35

max_dropdown_candidates_considered: 15
