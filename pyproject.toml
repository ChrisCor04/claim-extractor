[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "estimate-extractor"
version = "0.1.0"
description = "Multi-carrier property insurance estimate PDF extractor (carrier-agnostic canonical JSON output)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.6,<3",
    "pymupdf>=1.24,<2",
    "PyYAML>=6.0,<7",
    "python-dateutil>=2.8,<3",
    "click>=8.1,<9",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0"]
ui = ["streamlit>=1.30,<2", "pandas>=2.0,<3"]
semantic = ["sentence-transformers>=3.0,<6", "numpy>=1.26,<3"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
